<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 표 그리기-->
    <table border="1">
        <!-- 테이블 헤드 -->
        <thead>
        <tr>
            <!-- th: table header 헤드 셀 -->
            <th>이름</th>
            <th>나이</th>
            <th>이메일</th>
        </tr>
        </thead>

        <!-- 테이블 본문 -->
        <tbody>
        <tr>
            <!-- td: table data 데이터 셀 -->
            <td>alex</td>
            <td>20</td>
            <td>alex@example.com</td>
        </tr>
        <tr>
            <td>bob</td>
            <td>30</td>
            <td>bob@example.com</td>
        </tr>
        <tr>
            <td>chris</td>
            <td>40</td>
            <td>chris@example.com</td>
        </tr>
        </tbody>

    </table>
</body>
</html>
