<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer-box {
            /* 두께 2px, 점선, 검정색 */
            border: 2px dotted black;
            background: orange;
        }
        .inner-box {
            /* 두께 2px, 실선, 검정색 */
            background: skyblue;
            border: 2px solid black;
            margin: 5px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="outer-box">
        <div class="inner-box">BOX</div>
    </div>
</body>
</html>
