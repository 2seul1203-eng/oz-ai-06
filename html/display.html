<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: orange;
            border: 1px solid black;
        }
        p {
            background-color: skyblue;
            border: 1px solid black;
        }
        a {
            background-color: lightgreen;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <!-- Block-level 요소 -->
     <!-- 한 줄 전체를 차지 -->
    <div>Block 1</div>
    <div>Block 2</div>
    <div>Block 3</div>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>

    <!-- Inline -->
     <!-- 한 줄 내에서만 차지 -->
    <a href="#">Link 1</a>
    <a href="#">Link 2</a>
    <a href="#">Link 3</a>
</body>
</html>
