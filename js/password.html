<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 회원가입 -->
    <input type="password" placeholder="비밀번호 입력"></input>
    <button>회원가입</button>
    <div id="validation"></div>

    <script>
        const input = document.querySelector("input")
        const button = document.querySelector("button")
        const validation = document.querySelector("#validation")
        
        // 버튼 비활성화
        button.disabled = true
        let isValidated = false

        // 비밀번호 유효성 검사
        function validatePassword(){
            // 검사 통과
            if (input.value.length >= 4){
                isValid = true
                validation.textContent = "사용 가능한 비밀번호입니다."
                validation.style.color = "green"
            } else {
                // 실패
                isValid = false
                validation.textContent = "비밀번호를 4자리 이상 입력하세요."
                validation.style.color = "red"
            }
            
            // isValid = true -> 비밀번호 OK -> 버튼 활성화 -> disabled = false
            // isValid = false -> 비밀번호 X -> 버튼 비활성화 -> disabled = true
            button.disabled = !isValid
        }

        input.addEventListener("input", validatePassword)

    </script>
    
</body>
</html>
